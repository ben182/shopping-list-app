<!--
  Das Splash-Layout: Motiv über dem Schriftzug, beides zusammen mittig auf
  1280 × 1920 (Hochformat 2:3, die größte Dichte, die Android daraus zieht).

  NativePHP zeichnet das Bild bildschirmfüllend mit Crop. Auf einem schmalen
  Telefon bleibt davon nur die mittlere Spalte übrig, deshalb steht alles
  innerhalb der mittleren 60 % von Breite (256 … 1024) und Höhe (384 … 1536).

  Die Farben sind die des hellen Modus; `GrafikCommand` tauscht sie für
  `splash-dark.png` gegen die des dunklen aus. Das Motiv wird aus
  `motiv.svg` an die Stelle des Kommentars kopiert — eine Datei, eine Form.

  Der Schriftzug ist als Pfad ausgelegt, nicht als <text>: Der SVG-Renderer
  von Imagick hat keine Schriften registriert und ließe ihn sonst weg.
  Umrisse aus Roboto Medium (Apache License 2.0), Höhe 77 Einheiten.
-->
